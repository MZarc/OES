services:
  postgres:
    image: postgres:17-alpine
    container_name: oes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oes_db
    ports:
      - "5432:5432"
    volumes:
      - oes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oes_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: oes-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - oes_valkeydata:/data

  minio:
    image: minio/minio:latest
    container_name: oes-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - oes_miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: oes-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    volumes:
      - oes_mailpitdata:/data

volumes:
  oes_pgdata:
  oes_valkeydata:
  oes_miniodata:
  oes_mailpitdata:
